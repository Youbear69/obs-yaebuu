<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Web Controller</title>
    <meta name="description" content="Web-based OBS Studio remote controller via WebSocket - ควบคุม OBS ผ่านเว็บ">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ═══════════════ CONNECTION OVERLAY ═══════════════ -->
    <div id="connectionOverlay" class="overlay active">
        <div class="particles" id="particles"></div>
        <div class="connect-card">
            <div class="connect-card-glow"></div>
            <div class="connect-header">
                <div class="obs-logo-wrap">
                    <svg class="obs-logo-svg" viewBox="0 0 64 64" width="56" height="56">
                        <circle cx="32" cy="32" r="30" fill="none" stroke="url(#logoGrad)" stroke-width="2.5"/>
                        <path d="M22 32a10 10 0 1 1 20 0a10 10 0 1 1-20 0" fill="none" stroke="url(#logoGrad)" stroke-width="2.5"/>
                        <circle cx="32" cy="22" r="3" fill="#4fc3f7"/>
                        <circle cx="40.66" cy="37" r="3" fill="#7c4dff"/>
                        <circle cx="23.34" cy="37" r="3" fill="#00e676"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64">
                                <stop offset="0%" stop-color="#4fc3f7"/>
                                <stop offset="50%" stop-color="#7c4dff"/>
                                <stop offset="100%" stop-color="#00e676"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>OBS Web Controller</h1>
                <p class="connect-subtitle">Connect to your OBS WebSocket Server</p>
            </div>
            <div class="connect-form">
                <div class="form-row">
                    <div class="form-group flex-grow">
                        <label for="serverHost">Server Address</label>
                        <input id="serverHost" type="text" value="localhost" placeholder="localhost" spellcheck="false">
                    </div>
                    <div class="form-group flex-small">
                        <label for="serverPort">Port</label>
                        <input id="serverPort" type="number" value="4455" placeholder="4455">
                    </div>
                </div>
                <div class="form-group">
                    <label for="serverPassword">Password</label>
                    <div class="password-wrap">
                        <input id="serverPassword" type="password" placeholder="Enter server password (optional)">
                        <button id="togglePasswordBtn" class="toggle-pass-btn" type="button" title="Show/Hide Password">👁</button>
                    </div>
                </div>
                <button id="connectBtn" class="btn-connect">
                    <span class="btn-connect-text">Connect</span>
                    <span class="btn-connect-loader hidden">
                        <span class="spinner"></span> Connecting...
                    </span>
                </button>
                <div id="connectError" class="error-msg hidden"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════ MAIN INTERFACE ═══════════════ -->
    <div id="mainUI" class="main-ui hidden">

        <!-- ─── Top Bar ─── -->
        <header class="topbar" id="topbar">
            <div class="topbar-section topbar-left">
                <div class="topbar-brand">
                    <svg viewBox="0 0 64 64" width="22" height="22">
                        <circle cx="32" cy="32" r="30" fill="none" stroke="#4fc3f7" stroke-width="3"/>
                        <path d="M22 32a10 10 0 1 1 20 0a10 10 0 1 1-20 0" fill="none" stroke="#7c4dff" stroke-width="3"/>
                        <circle cx="32" cy="22" r="2.5" fill="#4fc3f7"/>
                    </svg>
                    <span class="brand-text">OBS Web Controller</span>
                </div>
            </div>
            <div class="topbar-section topbar-center">
                <div class="connection-badge" id="connectionBadge">
                    <span class="conn-dot"></span>
                    <span id="connectionLabel">Connected</span>
                </div>
            </div>
            <div class="topbar-section topbar-right">
                <button id="btnStudioMode" class="topbar-btn" title="Toggle Studio Mode">
                    <span class="tb-icon">⊞</span> Studio Mode
                </button>
                <button id="btnDisconnect" class="topbar-btn danger" title="Disconnect">
                    <span class="tb-icon">⏏</span> Disconnect
                </button>
            </div>
        </header>

        <!-- ─── Preview Section ─── -->
        <section class="preview-section" id="previewSection">
            <div class="preview-wrapper">
                <div class="preview-box" id="previewBox">
                    <div class="preview-label" id="previewLabel">Preview</div>
                    <div class="preview-inner">
                        <img id="previewImg" alt="" class="preview-img hidden">
                        <div id="previewFallback" class="preview-fallback">
                            <svg viewBox="0 0 64 64" width="48" height="48" opacity="0.3">
                                <rect x="8" y="14" width="48" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
                                <circle cx="32" cy="32" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
                                <circle cx="32" cy="32" r="3" fill="currentColor"/>
                            </svg>
                            <span>Preview</span>
                        </div>
                    </div>
                </div>
                <div class="preview-box program-box hidden" id="programBox">
                    <div class="preview-label live-label">Live / Program</div>
                    <div class="preview-inner">
                        <img id="programImg" alt="" class="preview-img hidden">
                        <div id="programFallback" class="preview-fallback">
                            <svg viewBox="0 0 64 64" width="48" height="48" opacity="0.3">
                                <rect x="8" y="14" width="48" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
                                <polygon points="28,24 28,40 42,32" fill="currentColor"/>
                            </svg>
                            <span>Program</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Studio Mode Transition Bar -->
            <div id="studioTransitionBar" class="studio-bar hidden">
                <select id="studioTransSelect" class="studio-select"></select>
                <div class="studio-dur-wrap">
                    <input id="studioTransDuration" type="number" value="300" min="0" max="20000" step="50" class="studio-dur-input">
                    <span class="studio-dur-label">ms</span>
                </div>
                <button id="studioTransBtn" class="btn-studio-transition">▶ Transition</button>
            </div>
        </section>

        <!-- ─── Bottom Dock ─── -->
        <section class="dock" id="dock">

            <!-- Scenes Panel -->
            <div class="dock-panel" id="panelScenes">
                <div class="dock-header"><span>Scenes</span></div>
                <div class="dock-body" id="sceneList"></div>
                <div class="dock-footer">
                    <button class="dock-btn" title="Add Scene" id="btnAddScene">＋</button>
                    <button class="dock-btn" title="Remove Scene" id="btnRemoveScene">🗑</button>
                    <span class="dock-spacer"></span>
                    <button class="dock-btn" title="Move Up" id="btnSceneUp">▲</button>
                    <button class="dock-btn" title="Move Down" id="btnSceneDown">▼</button>
                </div>
            </div>

            <!-- Sources Panel -->
            <div class="dock-panel" id="panelSources">
                <div class="dock-header"><span>Sources</span></div>
                <div class="dock-body" id="sourceList"></div>
                <div class="dock-footer">
                    <button class="dock-btn" title="Add Source" id="btnAddSource">＋</button>
                    <button class="dock-btn" title="Remove Source" id="btnRemoveSource">🗑</button>
                    <span class="dock-spacer"></span>
                    <button class="dock-btn" title="Move Up" id="btnSourceUp">▲</button>
                    <button class="dock-btn" title="Move Down" id="btnSourceDown">▼</button>
                </div>
            </div>

            <!-- Audio Mixer Panel -->
            <div class="dock-panel dock-panel-wide" id="panelMixer">
                <div class="dock-header"><span>Audio Mixer</span></div>
                <div class="dock-body mixer-body" id="mixerBody">
                    <div class="mixer-empty">No audio sources</div>
                </div>
            </div>

            <!-- Controls / Transitions Panel -->
            <div class="dock-panel" id="panelControls">
                <div class="dock-tabs">
                    <button class="dock-tab active" data-tab="tabControls">Controls</button>
                    <button class="dock-tab" data-tab="tabTransitions">Scene Transitions</button>
                </div>
                <div class="dock-body controls-body">
                    <div class="tab-pane active" id="tabControls">
                        <button id="btnStartStream" class="ctrl-btn stream-btn">
                            <span class="ctrl-icon">📡</span> Start Streaming
                        </button>
                        <button id="btnStartRecord" class="ctrl-btn record-btn">
                            <span class="ctrl-icon">⏺</span> Start Recording
                        </button>
                        <button id="btnStartVCam" class="ctrl-btn vcam-btn">
                            <span class="ctrl-icon">📷</span> Start Virtual Camera
                        </button>
                        <button id="btnStudioMode2" class="ctrl-btn studio-ctrl-btn">
                            <span class="ctrl-icon">⊞</span> Studio Mode
                        </button>
                    </div>
                    <div class="tab-pane" id="tabTransitions">
                        <div class="transition-config">
                            <div class="trans-group">
                                <label>Transition</label>
                                <select id="transitionPicker" class="trans-select"></select>
                            </div>
                            <div class="trans-group">
                                <label>Duration (ms)</label>
                                <input id="transitionDurInput" type="number" value="300" min="0" max="20000" step="50" class="trans-input">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ─── Status Bar ─── -->
        <footer class="statusbar" id="statusbar">
            <div class="statusbar-left">
                <span id="streamStatusBadge" class="sb-badge">
                    <span class="sb-dot"></span> LIVE: OFF
                </span>
                <span id="recordStatusBadge" class="sb-badge">
                    <span class="sb-dot"></span> REC: OFF
                </span>
                <span id="streamTimer" class="sb-timer hidden">⏱ 00:00:00</span>
                <span id="recordTimer" class="sb-timer hidden">⏺ 00:00:00</span>
            </div>
            <div class="statusbar-right">
                <span id="obsStats" class="sb-stats">CPU: --% &nbsp;|&nbsp; FPS: --</span>
            </div>
        </footer>

        <!-- ─── Modals ─── -->
        <!-- Add Scene Modal -->
        <div id="modalAddScene" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Add Scene</h3>
                    <button class="modal-close" data-close="modalAddScene">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Please enter the name of the scene</label>
                        <input type="text" id="newSceneName" placeholder="Scene 2">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn secondary" data-close="modalAddScene">Cancel</button>
                    <button class="modal-btn primary" id="btnConfirmAddScene">OK</button>
                </div>
            </div>
        </div>

        <!-- Add Source Modal -->
        <div id="modalAddSource" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Add Source</h3>
                    <button class="modal-close" data-close="modalAddSource">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Select Source Type</label>
                        <select id="newSourceType"></select>
                    </div>
                    <div class="form-group">
                        <label>Source Name</label>
                        <input type="text" id="newSourceName" placeholder="My New Source">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn secondary" data-close="modalAddSource">Cancel</button>
                    <button class="modal-btn primary" id="btnConfirmAddSource">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
